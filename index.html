<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatework Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: a white studio. Sticky control rail on the left, the sheet on the right; black is the only accent. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --stage:#FFFFFF; --ink:#000000; --muted:#5F5F5F; --rule:#E3E3E3;
  --accent:#000000; --focus:#000000; --chip:#F3F3F3;
  --display:"Bodoni Moda", Didot, "Bodoni 72", Georgia, serif;
  --ui:"Jost", Futura, "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topline{height:3px;background:var(--ink)}
header .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:28px 22px}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-weight:600;margin:0 0 6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,5vw,56px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic}
.lede{max-width:52ch;margin:10px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;border:1px solid var(--rule);border-radius:999px;padding:4px;background:var(--panel)}
.tabs button{font:inherit;font-weight:500;font-size:14px;letter-spacing:.04em;border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:28px;align-items:start;padding-block:4px 48px}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}.layout > main{order:-1}}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px 18px 20px;position:sticky;top:16px;display:grid;gap:18px}
@media (max-width:880px){.panel{position:static}}
.group{display:grid;gap:12px}
.group h2{font-family:var(--display);font-weight:400;font-style:italic;font-size:20px;margin:0;display:flex;align-items:baseline;justify-content:space-between}
.group h2 small{font-family:var(--ui);font-style:normal;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.only-border{border-bottom:1px solid var(--rule);padding-bottom:18px}
.field{display:grid;gap:5px}
.field > span,.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.field output{font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
select,input[type=number]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:3px;padding:7px 9px;width:100%}
input[type=range]{width:100%;accent-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:13.5px;border:0;background:var(--bg);color:var(--muted);padding:7px 4px;cursor:pointer}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seedrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.btn{font:inherit;font-size:13.5px;font-weight:500;letter-spacing:.03em;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 14px;border-radius:3px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{opacity:.85}
.toggles{display:grid;gap:8px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{accent-color:var(--ink);width:16px;height:16px;margin:0}
.swatches{display:flex;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);cursor:pointer;padding:0;position:relative;overflow:hidden}
.sw span{position:absolute;inset:26%;border-radius:50%}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.custom{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.custom label{display:flex;align-items:center;gap:6px}
.custom input[type=color]{width:28px;height:24px;border:1px solid var(--rule);border-radius:3px;padding:0;background:none}

.stagewrap{display:grid;gap:18px;min-width:0}
.stage{background:var(--stage);border:1px solid var(--rule);border-radius:4px;padding:clamp(16px,3vw,36px);display:grid;place-items:center;min-height:360px}
.stage svg{display:block;height:auto;box-shadow:0 0 0 1px var(--rule),0 10px 28px -14px rgba(0,0,0,.25)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between}
.meta{font-size:13px;color:var(--muted)}
.meta b{font-family:var(--display);font-weight:400;font-style:italic;font-size:17px;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.vars-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vars-head h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.thumb{background:var(--stage);border:1px solid var(--rule);border-radius:4px;padding:12px 10px 8px;cursor:pointer;display:grid;gap:6px;justify-items:center;font:inherit;color:var(--muted);font-size:12px;letter-spacing:.06em}
.thumb:hover{border-color:#B5B5B5}
.thumb[aria-current="true"]{border-color:var(--ink)}
.thumb svg{display:block;height:auto;box-shadow:0 0 0 1px var(--rule)}

.emb-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{border:1px solid var(--rule);border-radius:4px;overflow:hidden;display:grid;grid-template-rows:auto auto;background:var(--panel)}
.card .art{aspect-ratio:5/4;display:grid;place-items:center;padding:14px}
.card .art svg{width:100%;height:100%;display:block}
.card .foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px;padding:10px 10px 10px 12px;border-top:1px solid var(--rule)}
.card .name{font-family:var(--display);font-style:italic;font-size:16px;line-height:1.2;white-space:nowrap}
.card .name small{display:block;font-family:var(--ui);font-style:normal;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.mini{display:flex;gap:4px}
.mini button{font:inherit;font-size:12px;font-weight:500;border:1px solid var(--rule);background:transparent;color:var(--ink);padding:4px 8px;border-radius:3px;cursor:pointer}
.mini button:hover{border-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:3px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.only-border[hidden],.view[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<div class="topline" aria-hidden="true"></div>
<header>
  <div class="wrap">
    <div>
      <p class="eyebrow">Brand motif generator</p>
      <h1>Gate<em>work</em> Studio</h1>
      <p class="lede">Wrought-iron borders and small embellishments, drawn as clean vectors. Rounded, tapered scrolls and flowing acanthus leaves.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Generator">
      <button role="tab" id="tab-borders" aria-selected="true" data-view="borders">Borders</button>
      <button role="tab" id="tab-emb" aria-selected="false" data-view="emb">Embellishments</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <aside class="panel" aria-label="Settings">
      <section class="group only-border">
        <h2>Border <small>Layout</small></h2>
        <div class="field"><span class="lab">Detail</span>
          <div class="seg" id="detail" role="radiogroup" aria-label="Detail">
            <button type="button" role="radio" data-d="1">Simple</button><button type="button" role="radio" data-d="2">Balanced</button><button type="button" role="radio" data-d="3">Ornate</button>
          </div></div>
        <div class="seedrow">
          <label class="field"><span>Design no.</span><input type="number" id="seed" min="1" max="9999"></label>
          <button class="btn" id="shuffle" type="button">Next design</button>
        </div>
        <label class="field"><span>Format</span>
          <select id="format"></select></label>
        <label class="field"><span>Band</span>
          <select id="pattern">
            <option value="auto">Surprise me</option>
            <option value="rinceau">Running scroll</option>
            <option value="cpair">Back-to-back C scrolls</option>
            <option value="srun">Running S scrolls</option>
            <option value="heart">Lyre hearts</option>
          </select></label>
        <label class="field"><span>Centrepiece</span>
          <select id="centre">
            <option value="none">None</option>
            <option value="top">Top</option>
            <option value="topbottom">Top and bottom</option>
            <option value="all">All four sides</option>
          </select></label>
        <label class="field"><span>Frame</span>
          <select id="rail">
            <option value="single">Rails</option>
            <option value="double">Double rails</option>
            <option value="none">No rails</option>
          </select></label>
        <label class="field"><span>Band depth <output id="band-o"></output></span><input type="range" id="band" min="0.04" max="0.11" step="0.002"></label>
      </section>

      <section class="group">
        <h2>Finish <small>Shared</small></h2>
        <label class="field"><span>Iron</span>
          <select id="finish">
            <option value="solid">Solid iron</option>
            <option value="outline">Hollow outline</option>
            <option value="fine">Fine line</option>
          </select></label>
        <label class="field"><span>Bar weight <output id="weight-o"></output></span><input type="range" id="weight" min="1" max="7" step="0.1"></label>
        <label class="field"><span>Thick to thin <output id="contrast-o"></output></span><input type="range" id="contrast" min="0" max="1" step="0.05"></label>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="welds"> Show joinery details</label>
          <label class="toggle"><input type="checkbox" id="garden"> Acanthus leaves</label>
        </div>
        <div class="field"><span class="lab">Colour</span>
          <div class="swatches" id="swatches"></div>
          <div class="custom">
            <label>Ink <input type="color" id="ink"></label>
            <label>Paper <input type="color" id="paper"></label>
          </div>
        </div>
        <label class="toggle"><input type="checkbox" id="transparent"> Export without paper (transparent)</label>
      </section>
    </aside>

    <main>
      <section class="view stagewrap" id="view-borders" aria-labelledby="tab-borders">
        <div class="stage" id="stage"></div>
        <div class="bar">
          <div class="meta" id="meta"></div>
          <div class="actions">
            <button class="btn" type="button" id="copy-svg">Copy SVG</button>
            <button class="btn" type="button" id="dl-png">Download PNG</button>
            <button class="btn solid" type="button" id="dl-svg">Download SVG</button>
          </div>
        </div>
        <div class="vars-head">
          <h3>Variations</h3>
          <button class="btn" type="button" id="new-vars">New set of six</button>
        </div>
        <div class="vars" id="vars"></div>
      </section>

      <section class="view stagewrap" id="view-emb" aria-labelledby="tab-emb" hidden>
        <div class="emb-head">
          <div class="chips" id="chips"></div>
          <button class="btn solid" type="button" id="new-emb">Generate another dozen</button>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Geometry kernel: forged-iron vocabulary built from spirals
   ============================================================ */
const TAU = Math.PI * 2, SQ = Math.SQRT1_2;

function rngFrom(seed) {
  let a = (seed >>> 0) || 1;
  const f = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < 4; i++) f();
  return { f, range: (x, y) => x + (y - x) * f(), int: (x, y) => Math.floor(x + (y - x + 1) * f()), pick: arr => arr[Math.floor(f() * arr.length)], chance: p => f() < p };
}

// 2x3 affine matrices [a,b,c,d,e,f]: x' = a x + c y + e, y' = b x + d y + f
const I = [1, 0, 0, 1, 0, 0];
const Mt = (x, y) => [1, 0, 0, 1, x, y];
const Mr = t => [Math.cos(t), Math.sin(t), -Math.sin(t), Math.cos(t), 0, 0];
const MX = [-1, 0, 0, 1, 0, 0], MY = [1, 0, 0, -1, 0, 0], MD = [0, 1, 1, 0, 0, 0];
const mul = (A, B) => [A[0]*B[0]+A[2]*B[1], A[1]*B[0]+A[3]*B[1], A[0]*B[2]+A[2]*B[3], A[1]*B[2]+A[3]*B[3], A[0]*B[4]+A[2]*B[5]+A[4], A[1]*B[4]+A[3]*B[5]+A[5]];
const chain = (...ms) => ms.reduce((acc, m) => mul(m, acc), I); // applied in listed order
const ap = (M, p) => [M[0]*p[0] + M[2]*p[1] + M[4], M[1]*p[0] + M[3]*p[1] + M[5]];
const av = (M, v) => { const x = M[0]*v[0] + M[2]*v[1], y = M[1]*v[0] + M[3]*v[1], l = Math.hypot(x, y) || 1; return [x/l, y/l]; };
const about = (M, c) => chain(Mt(-c[0], -c[1]), M, Mt(c[0], c[1]));

// Spirals with curvature rising as a power of arc length: the shape a smith bends.
function spiralJ(L, turns, p, n = 120) {
  turns *= 1.2; p = .45 + p * .4; // callers speak in "tight hook" units; this opens the eye into a rounder smith's scroll
  const K = turns * TAU * (p + 1) / L, ds = L / n, pts = [[0, 0]];
  let x = 0, y = 0, th = 0;
  for (let i = 0; i < n; i++) {
    const s = (i + 0.5) * ds, k = K * Math.pow(s / L, p), tm = th + k * ds / 2;
    x += Math.cos(tm) * ds; y += Math.sin(tm) * ds; th += k * ds; pts.push([x, y]);
  }
  return pts;
}
const spiralC = (L, t, p) => { const h = spiralJ(L/2, t, p); return h.map(([x, y]) => [-x, y]).reverse().concat(h.slice(1)); };
const spiralS = (L, t, p) => { const h = spiralJ(L/2, t, p); return h.map(([x, y]) => [-x, -y]).reverse().concat(h.slice(1)); };
const flipY = pts => pts.map(([x, y]) => [x, -y]);
const tangent = (P, i) => { const a = P[Math.max(0, i-1)], b = P[Math.min(P.length-1, i+1)], l = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1; return [(b[0]-a[0])/l, (b[1]-a[1])/l]; };
const angOf = v => Math.atan2(v[1], v[0]);
const circ = (c, r, n = 72) => Array.from({ length: n }, (_, i) => [c[0] + r * Math.cos(i / n * TAU), c[1] + r * Math.sin(i / n * TAU)]);

// Shapes
const bar = (pts, prof = 'flat', o = {}) => ({ k: 'bar', pts, prof, ...o });
const line = (pts, o = {}) => ({ k: 'line', pts, ...o });
const dot = (c, m = 1.3, weld = false) => ({ k: 'dot', c, m, weld });
const disc = (c, r) => ({ k: 'disc', c, r });
const ring = (c, r, m = 1) => ({ k: 'ring', c, r, m });
const collar = (c, d, span, m = 1.6) => ({ k: 'collar', c, d, span, m });
const rope = (p0, p1) => ({ k: 'rope', p0, p1 });

function xf(S, M) {
  const sc = Math.sqrt(Math.abs(M[0]*M[3] - M[1]*M[2]));
  return S.map(s => {
    const o = { ...s };
    for (const key of ['pts', 'outline', 'rib']) if (s[key]) o[key] = s[key].map(p => ap(M, p));
    if (s.c) o.c = ap(M, s.c);
    if (s.d) o.d = av(M, s.d);
    if (s.r != null) o.r = s.r * sc;
    if (s.span != null) o.span = s.span * sc;
    if (s.p0) { o.p0 = ap(M, s.p0); o.p1 = ap(M, s.p1); }
    return o;
  });
}
function bboxOf(S) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; };
  for (const s of S) {
    for (const key of ['pts', 'outline']) if (s[key]) for (const p of s[key]) add(p[0], p[1]);
    if (s.k === 'ring' || s.k === 'disc') { add(s.c[0]-s.r, s.c[1]-s.r); add(s.c[0]+s.r, s.c[1]+s.r); }
    else if (s.c) add(s.c[0], s.c[1]);
    if (s.p0) { add(...s.p0); add(...s.p1); }
  }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}
function fitInto(S, [X0, Y0, X1, Y1], uniform = false) {
  const b = bboxOf(S); let sx = (X1 - X0) / (b.w || 1), sy = (Y1 - Y0) / (b.h || 1);
  if (uniform) sx = sy = Math.min(sx, sy);
  return xf(S, [sx, 0, 0, sy, (X0+X1)/2 - (b.x0+b.x1)/2*sx, (Y0+Y1)/2 - (b.y0+b.y1)/2*sy]);
}
const scaleAbout = (S, [ax, ay], k) => xf(S, [k, 0, 0, k, ax - ax*k, ay - ay*k]);
function clampTo(S, [ax, ay], box) {
  const b = bboxOf(S); let k = 1;
  if (b.x0 < box[0] && ax > b.x0) k = Math.min(k, (ax - box[0]) / (ax - b.x0));
  if (b.x1 > box[2] && b.x1 > ax) k = Math.min(k, (box[2] - ax) / (b.x1 - ax));
  if (b.y0 < box[1] && ay > b.y0) k = Math.min(k, (ay - box[1]) / (ay - b.y0));
  if (b.y1 > box[3] && b.y1 > ay) k = Math.min(k, (box[3] - ay) / (b.y1 - ay));
  return k < 1 ? scaleAbout(S, [ax, ay], Math.max(k, 0.1)) : S;
}
const ptsOf = S => S.flatMap(s => s.pts || s.outline || []);
function nearest(A, B) {
  let best = Infinity, ia = 0, pb = B[0];
  for (let i = 0; i < A.length; i += 2) for (let j = 0; j < B.length; j += 2) {
    const d = (A[i][0] - B[j][0]) ** 2 + (A[i][1] - B[j][1]) ** 2;
    if (d < best) { best = d; ia = i; pb = B[j]; }
  }
  return { ia, a: A[ia], b: pb, d: Math.sqrt(best) };
}
// Weld two touching bars with a collar at their closest approach.
function weldAt(A, B, w) {
  const n = nearest(A, B);
  return collar([(n.a[0] + n.b[0]) / 2, (n.a[1] + n.b[1]) / 2], tangent(A, n.ia), n.d + 2.4 * w);
}

// Rounded teardrop leaf: narrow at the stem, a full round end. The acanthus lobe of the references.
function leaf(base, ang, len, wid, bend = 0) {
  const n = 24, up = [], lo = [], rib = [], c = .5;
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = t * len, yc = bend * len * t * t;
    const hw = wid * .5 * (t <= c ? Math.pow(Math.sin(Math.PI / 2 * t / c), .85) : Math.sqrt(Math.max(0, 1 - ((t - c) / (1 - c)) ** 2)));
    up.push([x, yc - hw]); lo.push([x, yc + hw]); if (t <= .7) rib.push([x, yc]);
  }
  const outline = up.concat(lo.slice(1, -1).reverse());
  return xf([{ k: 'leaf', outline, rib }], chain(Mr(ang), Mt(base[0], base[1])));
}
// Acanthus: three rounded lobes fanning to one side and curling, the forged leaf of the references.
// A single lobed silhouette avoids stacked teardrops merging into black knots.
function bezier(points, steps = 28) {
  const out = [points[0]];
  for (let k = 1; k < points.length; k += 3) {
    const a = points[k-1], b = points[k], c = points[k+1], d = points[k+2];
    for (let i = 1; i <= steps; i++) {
      const t = i/steps, u = 1-t;

/* ---------- Border assembly ---------- */
const FORMATS = {
  letter: { w: 850, h: 1100, label: 'Letterhead, 8.5 × 11' },
  card: { w: 1050, h: 750, label: 'Note card, 7 × 5' },
  square: { w: 1080, h: 1080, label: 'Square post, 1:1' },
  biz: { w: 1050, h: 600, label: 'Business card, 3.5 × 2' },
  story: { w: 1080, h: 1920, label: 'Story, 9:16' },

const PATTERN_NAMES = { rinceau: 'Running scroll', cpair: 'Back-to-back C scrolls', srun: 'Running S scrolls', heart: 'Lyre hearts' };

function edgesFor(W, H, m, b) {

    { M: [0, 1, -1, 0, W - m, m + b], len: lh },

// Reference study: repeat a master motif at a uniform scale; fit the spaces between motifs.
// Historic references and the audit rationale are recorded in the accompanying research brief.
function buildBorder(st, seed) {

  const autoPattern = RA.pick(D === 1 ? ['rinceau', 'cpair', 'srun'] : ['rinceau', 'rinceau', 'cpair', 'srun', 'heart']);
  const cornerType = RA.pick(['knot', 'palmette', 'volute', 'plate']);

  const blk = cornerBlock(cornerType, rngFrom(seed * 5 + 3), o);
  const cp = centrePiece(rngFrom(seed * 23 + 9), o);
  const centreEdges = { none: [], top: [0], topbottom: [0, 2], all: [0, 1, 2, 3] }[st.centre];
  // A single scale for all four sides prevents circles becoming different ellipses.
  const scale = Math.min(b - 2*pad, ...E.map((e,ei) => e.len / (2*tpl.A + (centreEdges.includes(ei) ? cp.Wc : 0) + .4)));

  const withTies = body => {
    body = body.map(s => s.k === 'collar' ? {...s, span: Math.max(s.span, w*2.4)} : s);
    if (!rails) return body;
    const P = body.filter(s => s.k==='bar' || s.k==='line').flatMap(s=>s.pts || []);
    if (!P.length) return body;
    const minY=Math.min(...P.map(p=>p[1])), maxY=Math.max(...P.map(p=>p[1]));

    }

      const end=starts[n-1]+cell;

        const mid=xf(cp.body,[scale,0,0,scale,e.len/2,y]);
        const candidates=mid.filter(s=>s.pts).flatMap(s=>s.pts.map((p,i)=>({p,d:tangent(s.pts,i)})));

/* ============================================================
   Renderer: shapes -> SVG markup
   Solid: filled iron with round ends. Outline: the same iron, hollowed with a mask so overlaps merge cleanly.
   ============================================================ */
// Width along a bar, scaled by k (0 = even bar, 1 = full swell). j: heavy root thinning into the curl; c: slender waist and fuller shoulders,
// thin at both curls; jr: thin eye growing outward; wave: a running stem, thick between crests and pinched where it is welded.
const PROF = {
  j: (t, k) => 1 + k * (.42 * Math.cos(Math.PI*t) + .55 * Math.sin(Math.PI*t)**2 - .2),
  c: (t, k) => 1 + k * (.85 * Math.sin(2*Math.PI*t)**2 - .55),
  jr: (t, k) => 1 + k * (-.42 * Math.cos(Math.PI*t) + .55 * Math.sin(Math.PI*t)**2 - .2),
  wave: (t, k) => 1 + k * (.7 * Math.sin(2*Math.PI*t)**2 - .4),
  flat: () => 1,

function decimate(P, tol) {

  out.push(P[P.length - 1]); return out;
}

  const circD = (c, r) => `M${(c[0] - r).toFixed(prec)} ${c[1].toFixed(prec)}a${r.toFixed(2)} ${r.toFixed(2)} 0 1 0 ${(2 * r).toFixed(2)} 0a${r.toFixed(2)} ${r.toFixed(2)} 0 1 0 ${(-2 * r).toFixed(2)} 0Z`;

    const tot = cum[n - 1] || 1, L = [], Rr = [];

/* ---------- Export ---------- */
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); };

async function saveFile(filename, data) {
  const dl = await dlReady;
  if (dl) {
    try { await dl.save({ filename, data }); toast(`Saved ${filename}`); }
    catch (e) { if (e?.code === 'declined') return; toast(e?.code === 'rate_limited' ? 'A save is already waiting for you. Try again in a moment.' : 'Downloads are not available here. Use Copy SVG instead.'); }
  } else if (dl === undefined) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'image/svg+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast(`Saved ${filename}`);
  } else toast('Downloads are not available here. Use Copy SVG instead.');
}

  const m = svg.match(/width="(\d+)" height="(\d+)"/), w0 = +m[1], h0 = +m[2], k = longSide / Math.max(w0, h0);
  const img = new Image(), url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));

    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const cv = document.createElement('canvas'); cv.width = Math.round(w0 * k); cv.height = Math.round(h0 * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    await saveFile(filename, blob);
  } catch (e) { toast('The PNG could not be drawn. Download the SVG instead.'); }
  finally { URL.revokeObjectURL(url); }
}

  if (!navigator.clipboard) { toast('Copying is blocked here. Use Download SVG.'); return; }
  navigator.clipboard.writeText(text).then(() => toast('SVG copied. Paste it straight into Figma or Illustrator.'), () => toast('Copying is blocked here. Use Download SVG.'));
}

for (const id of ['band', 'weight', 'contrast']) $('#' + id).addEventListener('input', e => { st[id] = +e.target.value; $('#' + id + '-o').textContent = fmt[id](st[id]); update(); });
$('#detail').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.detail = +b.dataset.d; syncInputs(); update(); });
for (const id of ['welds', 'garden', 'transparent']) $('#' + id).addEventListener('change', e => { st[id] = e.target.checked; if (id !== 'transparent') update(); else save(); });
for (const id of ['ink', 'paper']) $('#' + id).addEventListener('input', e => { st[id] = e.target.value; syncInputs(); update(); });
$('#seed').addEventListener('change', e => { const v = Math.max(1, Math.min(9999, Math.round(+e.target.value) || 1)); selectDesign(v); st.varStart=Math.floor((v-1)/6)*6; e.target.value = v; update(); });
$('#shuffle').addEventListener('click', () => { selectDesign(st.patternNo+1); st.varStart=Math.floor((st.patternNo-1)/6)*6; syncInputs(); update(); });
$('#new-vars').addEventListener('click', () => { st.varStart += 6; update(); });
$('#new-emb').addEventListener('click', () => { st.embStart += 12; update(); });
$('#swatches').addEventListener('click', e => { const b = e.target.closest('.sw'); if (!b) return; const p = PALETTES.find(x => x.id === b.dataset.p); st.ink = p.ink; st.paper = p.paper; syncInputs(); update(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; st.embType = b.dataset.t; syncInputs(); update(); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { st.view = b.dataset.view; syncInputs(); update(); }));

syncInputs(); update();
</script>
